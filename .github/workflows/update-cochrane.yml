name: Update Cochrane Feed

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-cochrane-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch Cochrane feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-nano
        run: python scripts/fetch_cochrane.py

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit changes
        env:
          DOCSPACE_FEED_PUSH_ENDPOINT: ${{ secrets.DOCSPACE_FEED_PUSH_ENDPOINT }}
          DOCSPACE_FEED_PUSH_SECRET: ${{ secrets.DOCSPACE_FEED_PUSH_SECRET }}
        run: |
          if git diff --quiet -- data/cochrane-feed.json; then
            echo "No Cochrane feed changes"
            exit 0
          fi
          git config user.name "docspace-bot"
          git config user.email "docspace-bot@users.noreply.github.com"
          git add data/cochrane-feed.json
          git commit -m "Update Cochrane feed"
          git push
          bash scripts/send_feed_push.sh cochrane data/cochrane-feed.json
