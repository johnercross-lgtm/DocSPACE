name: Update MOZ News Feed

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run MOZ news script
        run: python scripts/fetch_moz_news.py

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit updated MOZ feed
        run: |
          git config user.name "docspace-bot"
          git config user.email "docspace-bot@users.noreply.github.com"
          git add data/ukrainian-news-feed.json
          if git diff --cached --quiet; then
            echo "No MOZ feed changes"
            exit 0
          fi
          git commit -m "Update MOZ news feed"
          git push
