name: Update FDA/EMA Safety Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "35 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate FDA/EMA safety feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-nano' }}
        run: python scripts/fetch_fda_ema_safety.py

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit safety feed
        env:
          DOCSPACE_FEED_PUSH_ENDPOINT: ${{ secrets.DOCSPACE_FEED_PUSH_ENDPOINT }}
          DOCSPACE_FEED_PUSH_SECRET: ${{ secrets.DOCSPACE_FEED_PUSH_SECRET }}
        run: |
          if [ ! -f data/fda-ema-safety-feed.json ]; then
            echo "data/fda-ema-safety-feed.json was not created"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/fda-ema-safety-feed.json

          if git diff --cached --quiet; then
            echo "No safety feed changes"
          else
            git commit -m "Update FDA/EMA safety feed"
            git push
            bash scripts/send_feed_push.sh safety data/fda-ema-safety-feed.json
          fi
