name: Update PubMed Feed

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run PubMed script
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-nano
        run: python scripts/fetch_pubmed.py

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit updated feed
        run: |
          if git diff --quiet -- data/pubmed-feed.json; then
            echo "No PubMed feed changes"
            exit 0
          fi
          git config user.name "docspace-bot"
          git config user.email "docspace-bot@users.noreply.github.com"
          git add data/pubmed-feed.json
          git commit -m "Update PubMed feed"
          git push
