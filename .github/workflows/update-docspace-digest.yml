name: Update DocSPACE Digest Feed

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run DocSPACE digest fetcher
        run: python scripts/fetch_docspace_digest.py

      - name: Commit updated DocSPACE digest feed
        run: |
          git config user.name "docspace-bot"
          git config user.email "docspace-bot@users.noreply.github.com"
          git add data/docspace-digest-feed.json
          git diff --cached --quiet || git commit -m "Update DocSPACE digest feed"
          git push
