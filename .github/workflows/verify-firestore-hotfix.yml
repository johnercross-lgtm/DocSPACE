name: Verify Firestore hotfix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-firestore-hotfix.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --requirement requirements-scheduler.txt
      - name: Verify Firestore access
        env:
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
          FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
        run: |
          python - <<'PY'
          import os
          from google.cloud import firestore

          client = firestore.Client(
              project=os.environ["FIREBASE_PROJECT_ID"],
              database=os.environ.get("FIRESTORE_DATABASE", "(default)"),
          )
          client.collection("feed_scheduler_state").limit(1).get()
          print("Firestore access OK")
          PY
