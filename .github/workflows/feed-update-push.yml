name: Feed update push test

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Feed source payload value"
        required: true
        default: "medical_news"
      feed_file:
        description: "Feed JSON file to hash and include in changedFiles"
        required: true
        default: "data/pubmed-feed.json"

permissions:
  contents: read

jobs:
  notify-feed-update:
    name: Send manual feed update push
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send feed update push
        env:
          DOCSPACE_FEED_PUSH_ENDPOINT: ${{ secrets.DOCSPACE_FEED_PUSH_ENDPOINT }}
          DOCSPACE_FEED_PUSH_SECRET: ${{ secrets.DOCSPACE_FEED_PUSH_SECRET }}
          FEED_PUSH_SOURCE: ${{ inputs.source }}
          FEED_PUSH_FILE: ${{ inputs.feed_file }}
        run: |
          bash scripts/send_feed_push.sh "$FEED_PUSH_SOURCE" "$FEED_PUSH_FILE"
