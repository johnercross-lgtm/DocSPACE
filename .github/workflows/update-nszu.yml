name: Update NSZU News Feed

on:
  workflow_dispatch:
  schedule:
    - cron: "10 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate NSZU feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-nano' }}
        run: python scripts/fetch_nszu_news.py

      - name: Validate feeds
        run: python scripts/validate_feeds.py

      - name: Commit NSZU feed
        run: |
          if [ ! -f data/nszu-feed.json ]; then
            echo "data/nszu-feed.json was not created"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/nszu-feed.json

          if git diff --cached --quiet; then
            echo "No NSZU feed changes"
          else
            git commit -m "Update NSZU news feed"
            git push
          fi
